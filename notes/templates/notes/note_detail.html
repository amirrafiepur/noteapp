{% extends "base.html" %}

{% block title %}جزئیات متن{% endblock %}
{% block body_class %}page-note-detail{% endblock %}

{% block content %}
<header class="page-header">
    <h1 class="page-header__title">جزئیات متن</h1>
    <p class="page-header__subtitle">مشاهده کامل یادداشت ذخیره‌شده</p>
</header>

<article class="note-detail card">
    <header class="card__header">
        <h2 class="card__title">متن یادداشت</h2>
        <time class="note-detail__date" datetime="{{ note.created_at|date:'c' }}">
            {{ note.created_at|date:"Y/m/d H:i" }}
        </time>
    </header>

    <div class="note-detail__body">
        <div class="note-detail__content">{{ note.content }}</div>
    </div>

    <footer class="note-detail__actions">
        <a class="btn btn--ghost" href="{% url 'dashboard' %}">بازگشت به داشبورد</a>
        <a class="btn btn--primary" href="{% url 'note_print' note.pk %}" target="_blank" rel="noopener noreferrer">چاپ متن</a>
    </footer>
</article>
{% endblock %}
